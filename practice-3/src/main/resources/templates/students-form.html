<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление студента</title>
</head>
<body>
<h1>Добавление студента</h1>
<form th:action="@{/students/add}" th:object="${student}" method="post">
    <p>
        <label>Имя:</label>
        <input type="text" th:field="*{name}" required>
    </p>
    <p>
        <label>Курс:</label>
        <input type="number" min="1" max="6" th:field="*{course}" required>
    </p>
    <p>
        <label>
            <input type="checkbox" th:field="*{hasDebt}"> Есть задолженность
        </label>
    </p>
    <button type="submit">Сохранить</button>
    <a href="/students">Назад</a>
</form>
</body>
</html>
